[workspace]
authors = ["Camille Gueguen"]
channels = ["conda-forge"]
name = "healpix-resample"
platforms = ["linux-64"]
version = "2026.5.1"
preview = ["pixi-build"]

[package]
name = "healpix-resample"
version = "9999.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
setuptools = ">=82.0.0"
setuptools-scm = ">=8.0"

[package.run-dependencies]
python = ">=3.10"
numpy = ">=2.4.2,<3"
pytorch = ">=2.0,<3"
healpix-geo = ">=0.4.1"

[tasks]

[dependencies]
healpix-resample = { path = "." }
numpy = ">=2.4.2,<3"
python = ">=3.10,<3.14"
jupyterlab = ">=4.5.5,<5"
pytorch = ">=2.0,<3"
healpix-geo = ">=0.4.1"

[pypi-dependencies]

[feature.affine.dependencies]
affine = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.docs.dependencies]
fftw = "*"
sphinx = "*"
pydata-sphinx-theme = "*"
myst-nb = "*"
sphinx-autobuild = "*"
geopandas = "*"
tabulate = "*"
markdown = "*"
pandas = "*"
pyresample = "*"
sphinx-design = "*"
pyproj = "*"
matplotlib-base = ">=3.7,<4"

[feature.test.tasks]
tests = { cmd = "pytest --cov=healpix_resample" }

[feature.docs.tasks]
build-docs = { cmd = "rm -rf generated/; python -m sphinx -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }
autobuild-docs = { cmd = "sphinx-autobuild -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }
build-docs-rtd = { cmd = "python -m sphinx -b html -W -T -j auto . $READTHEDOCS_OUTPUT/html", cwd = "docs" }

[feature.dev.dependencies]
ipython = "*"
jupyterlab = "*"
black = "*"
jupyter-resource-usage = "*"
jupyterlab_code_formatter = "*"
isort = "*"

[environments]
default = ["test", "dev", "affine"]
docs = ["docs"]
