[workspace]
authors = ["Camille Gueguen"]
channels = ["conda-forge"]
name = "healpix-resample"
platforms = ["linux-64"]
version = "2026.5.1"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
python = ">=3.10,<3.14"
jupyterlab = ">=4.5.5,<5"
pytorch = ">=2.0,<3"

[pypi-dependencies]
healpix-resample= { path = ".", editable = true }
healpix-geo = "*"

[feature.affine.dependencies]
affine = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
# tests/test_kernel_geometry.py imports pyproj
pyproj = "*"

[feature.docs.dependencies]
fftw = "*"
sphinx = "*"
pydata-sphinx-theme = "*"
myst-nb = "*"
sphinx-autobuild = "*"
geopandas = "*"
tabulate = "*"
markdown = "*"
pandas = "*"
pyresample = "*"
sphinx-design = "*"
pyproj = "*"
matplotlib-base = ">=3.7,<4"

[feature.test.tasks]
tests = { cmd = "pytest --cov=healpix_resample" }

[feature.docs.tasks]
build-docs = { cmd = "rm -rf generated/; python -m sphinx -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }
autobuild-docs = { cmd = "sphinx-autobuild -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }
build-docs-rtd = { cmd = "python -m sphinx -b html -W -T -j auto . $READTHEDOCS_OUTPUT/html", cwd = "docs" }

[feature.dev.dependencies]
ipython = "*"
jupyterlab = "*"
black = "*"
jupyter-resource-usage = "*"
jupyterlab_code_formatter = "*"
isort = "*"

[feature.notebooks.dependencies]
# Everything notebooks/ needs. None of this was declared anywhere, so the
# notebook producing the paper's tables and figures could not be run from a
# checkout. All conda-forge: mixing a PyPI pyproj wheel with conda's libproj
# breaks PROJ's database lookup and silently unregisters the eopf-zarr backend.
cfgrib = "*"
foscat = "*"
healpy = "*"
matplotlib-base = ">=3.7,<4"
pandas = "*"
pillow = "*"
pyproj = "*"
pystac-client = "*"
# reads the Sentinel-2 L2A Cloud-Optimized GeoTIFFs served by Element 84's
# earth-search catalogue. The EOPF STAC used for the four paper scenes is a
# European demonstration catalogue with partial global coverage, so the
# multi-region experiment reads COGs instead (see REGION_STAC_SOURCE in
# tests/real_groundtruth_common_tools.py).
rasterio = "*"
scikit-image = "*"
scikit-learn = "*"
scipy = "*"
xarray = "*"
# provides the engine="eopf-zarr" backend used to read Sentinel-2 from the
# EOPF STAC. Nothing imports it by name, so an import scan will not see it.
xarray-eopf = "*"
# xarray-eopf does not support Zarr v3 yet; the notebook only round-trips its
# own cache, so v2 is sufficient.
zarr = ">=2.11,<3"

[environments]
default = ["test", "dev", "affine"]
docs = ["docs"]
notebooks = ["notebooks", "test"]
