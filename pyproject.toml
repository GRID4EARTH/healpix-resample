[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "healpix-resample"
dynamic = ["version"]
description = "Sparse GPU-enabled regridding from lon/lat to HEALPix"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

authors = [
  { name = "Jean-Marc Delouis" },
  { name = "Tina Odaka" },
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy",
  "torch",
  "healpix-geo",
  "healpix-plot",
  "scipy",
]

[project.optional-dependencies]
# healpix_resample.utm (HEALPix -> UTM raster) reprojects pixel centers with
# pyproj. In a conda/pixi environment, install pyproj from conda-forge
# instead (see REPRODUCING.md on not mixing a PyPI pyproj with conda's PROJ).
utm = ["pyproj"]

[tool.setuptools.packages.find]
include = [
    "healpix_resample",
    "healpix_resample.*",
]

[tool.pytest.ini_options]
markers = [
  "notebooks: needs the `notebooks` pixi environment (run with `pixi run -e notebooks pytest -m notebooks`)",
]
# The notebook-environment guards need dependencies the default environment
# deliberately does not carry, so they are opt-in.
addopts = "-m 'not notebooks'"

[tool.setuptools_scm]
